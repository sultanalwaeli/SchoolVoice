        // ================================================================
        // CENTRAL DATA STORAGE — SUPABASE
        // The visual design/content is intentionally unchanged.
        // ================================================================
        const SUPABASE_URL = 'https://skcoeyxbyuxozpcwinxh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_0GMF9dUQVZdVoLN8dHYmsw_jEMPBOHy';
        const SUPABASE_SYNC_INTERVAL_MS = 4000;
        const SUPABASE_CONFIGURED =
            SUPABASE_URL.startsWith('https://') &&
            !SUPABASE_URL.includes('PASTE_YOUR_') &&
            !SUPABASE_ANON_KEY.includes('PASTE_YOUR_');

        let questionsDatabase = [];
        let isReceptionOpen = true;
        let adminLogs = [];
        let isAdminLoggedIn = false; // Secure Session Flag
        let currentViewName = 'home';
        let centralSyncTimer = null;
        let centralSyncInProgress = false;

        function ensureSupabaseConfigured() {
            if (!SUPABASE_CONFIGURED) {
                alert('لم يتم ربط قاعدة البيانات بعد. يرجى وضع رابط مشروع Supabase ومفتاح Anon في أعلى الملف.');
                return false;
            }
            return true;
        }

        async function supabaseRequest(path, options = {}) {
            if (!SUPABASE_CONFIGURED) throw new Error('Supabase is not configured.');
            const headers = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
            };
            const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
                ...options,
                headers
            });
            if (!response.ok) {
                const body = await response.text().catch(() => '');
                throw new Error(`Supabase ${response.status}: ${body}`);
            }
            if (response.status === 204) return null;
            const text = await response.text();
            return text ? JSON.parse(text) : null;
        }

        function mapQuestionFromSupabase(row) {
            return {
                id: row.id,
                target: row.target,
                schoolName: row.school_name,
                schoolCode: row.school_code,
                question: row.question,
                answer: row.answer || '',
                timestamp: row.timestamp
            };
        }

        async function syncFromSupabase(forceRender = false) {
            if (!SUPABASE_CONFIGURED || centralSyncInProgress) return;
            centralSyncInProgress = true;
            try {
                const [questions, settings, logs] = await Promise.all([
                    supabaseRequest('questions?select=id,target,school_name,school_code,question,answer,timestamp&order=created_at.asc'),
                    supabaseRequest('settings?select=key,value&key=eq.reception_open&limit=1'),
                    supabaseRequest('logs?select=timestamp,admin,action&order=created_at.desc&limit=500')
                ]);

                questionsDatabase = Array.isArray(questions) ? questions.map(mapQuestionFromSupabase) : [];
                if (Array.isArray(settings) && settings[0]) isReceptionOpen = settings[0].value !== false;
                adminLogs = Array.isArray(logs) ? logs : [];

                if (forceRender) refreshCurrentView();
            } catch (error) {
                console.error('Supabase sync failed:', error);
            } finally {
                centralSyncInProgress = false;
            }
        }

        function refreshCurrentView() {
            switch (currentViewName) {
                case 'directorOffice': renderDirectorOffice(); break;
                case 'answersPortal': renderAnswersPortal(); break;
                case 'participationStats': renderParticipationStats(); break;
                case 'totalQuestionsStats': renderTotalQuestionsStats(); break;
                case 'adminDashboard': if (isAdminLoggedIn) renderAdminDashboardView(); break;
                case 'home': renderHome(); break;
                default: break;
            }
        }

        function startCentralSync() {
            if (!SUPABASE_CONFIGURED) return;
            syncFromSupabase(true);
            if (centralSyncTimer) clearInterval(centralSyncTimer);
            centralSyncTimer = setInterval(() => syncFromSupabase(true), SUPABASE_SYNC_INTERVAL_MS);
            window.addEventListener('focus', () => syncFromSupabase(true));
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) syncFromSupabase(true);
            });
        }

        async function createQuestionRemotely(entry) {
            await supabaseRequest('questions', {
                method: 'POST',
                headers: { 'Prefer': 'return=minimal' },
                body: JSON.stringify({
                    id: entry.id,
                    target: entry.target,
                    school_name: entry.schoolName,
                    school_code: entry.schoolCode,
                    question: entry.question,
                    answer: entry.answer || '',
                    timestamp: entry.timestamp
                })
            });
        }

        async function updateAnswerRemotely(questionId, answerText) {
            await supabaseRequest(`questions?id=eq.${encodeURIComponent(questionId)}`, {
                method: 'PATCH',
                headers: { 'Prefer': 'return=minimal' },
                body: JSON.stringify({ answer: answerText })
            });
        }

        async function deleteQuestionRemotely(questionId) {
            await supabaseRequest(`questions?id=eq.${encodeURIComponent(questionId)}`, {
                method: 'DELETE',
                headers: { 'Prefer': 'return=minimal' }
            });
        }

        async function updateReceptionRemotely(open) {
            await supabaseRequest('settings?on_conflict=key', {
                method: 'POST',
                headers: {
                    'Prefer': 'resolution=merge-duplicates,return=minimal'
                },
                body: JSON.stringify({ key: 'reception_open', value: !!open })
            });
        }

        async function addLogAction(actionText) {
            const now = new Date();
            const timeStr = now.toLocaleDateString('ar-OM') + ' – ' + now.toLocaleTimeString('ar-OM', { hour: '2-digit', minute: '2-digit' });
            const logEntry = {
                timestamp: timeStr,
                admin: 'مسؤول المنصة',
                action: actionText
            };
            try {
                await supabaseRequest('logs', {
                    method: 'POST',
                    headers: { 'Prefer': 'return=minimal' },
                    body: JSON.stringify(logEntry)
                });
                adminLogs.unshift(logEntry);
            } catch (error) {
                console.error('Supabase log failed:', error);
            }
        }

        async function wipeRemoteData() {
            await Promise.all([
                supabaseRequest('questions?id=not.is.null', { method: 'DELETE', headers: { 'Prefer': 'return=minimal' } }),
                supabaseRequest('logs?timestamp=not.is.null', { method: 'DELETE', headers: { 'Prefer': 'return=minimal' } })
            ]);
        }

        // Handle Question Submission Form
        async function handleQuestionSubmit(event, targetName) {
            event.preventDefault();

            if (!isReceptionOpen) {
                alert('تنبيه: استقبال الاستفسارات مغلق حالياً بقرار إداري.');
                return;
            }

            const schoolName = document.getElementById('school_name_input').value;
            const schoolCode = document.getElementById('school_code_input').value.trim();
            const questionText = document.getElementById('question_text_input').value.trim();

            if (!schoolName || !schoolCode || !questionText) {
                alert('الرجاء تعبئة جميع الحقول الإجبارية أولاً.');
                return;
            }

            const newEntry = {
                id: 'Q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
                target: targetName,
                schoolName: schoolName,
                schoolCode: schoolCode,
                question: questionText,
                answer: '',
                timestamp: new Date().toLocaleString('ar-OM')
            };

            if (!ensureSupabaseConfigured()) return;
            try {
                await createQuestionRemotely(newEntry);
                questionsDatabase.push(newEntry);
                alert('تم تسجيل سؤالك بنجاح وتحديث الإحصائيات المباشرة بالنظام.');
                renderQuestionForm(targetName);
                syncFromSupabase(true);
            } catch (error) {
                console.error(error);
                alert('تعذر حفظ السؤال في قاعدة البيانات المركزية. يرجى المحاولة مرة أخرى.');
            }
        }

                    </div>

                        <p class="text-sm font-bold text-slate-800 bg-amber-50/50 p-3 rounded-xl border border-amber-100">${q.question}</p>

        async function saveAnswer(questionId) {
            const input = document.getElementById(`answer_input_${questionId}`);
            if (!input) return;
            const answerText = input.value.trim();
            const qObj = questionsDatabase.find(q => q.id === questionId);
            if (!qObj) return;
            if (!ensureSupabaseConfigured()) return;

            try {
                await updateAnswerRemotely(questionId, answerText);
                qObj.answer = answerText;
                await addLogAction(`كتابة/تحديث إجابة للسؤال ID: (${questionId})`);
                alert('تم تسجيل إجابة الدائرة وتحديثها على المنصة للمتابعين والمستخدمين.');
                renderAnswersPortal();
            } catch (error) {
                console.error(error);
                alert('تعذر حفظ الإجابة في قاعدة البيانات المركزية. يرجى المحاولة مرة أخرى.');
            }
        }

        // Delete single question by Admin
        async function adminDeleteQuestion(qId) {
            if (confirm('هل أنت متأكد من حذف هذا السؤال بشكل نهائي؟')) {
                if (!ensureSupabaseConfigured()) return;
                try {
                    await deleteQuestionRemotely(qId);
                    questionsDatabase = questionsDatabase.filter(q => q.id !== qId);
                    await addLogAction(`حذف السؤال المعرف برقم: (${qId})`);
                    renderAdminDashboardView();
                } catch (error) {
                    console.error(error);
                    alert('تعذر حذف السؤال من قاعدة البيانات المركزية.');
                }
            }
        }

        async function adminDeleteAnswer(qId) {
            const qObj = questionsDatabase.find(q => q.id === qId);
            if (qObj && confirm('هل أنت متأكد من مسح إجابة هذا السؤال؟')) {
                if (!ensureSupabaseConfigured()) return;
                try {
                    await updateAnswerRemotely(qId, '');
                    qObj.answer = '';
                    await addLogAction(`مسح إجابة السؤال المعرف برقم: (${qId})`);
                    renderAdminDashboardView();
                } catch (error) {
                    console.error(error);
                    alert('تعذر مسح الإجابة من قاعدة البيانات المركزية.');
                }
            }
        }

                await updateReceptionRemotely(false);
                isReceptionOpen = false;
                await addLogAction('إغلاق استقبال الاستفسارات عن المنصة');
                closeConfirmationModal();
                renderAdminDashboardView();
            } catch (error) {
                console.error(error);
                alert('تعذر تحديث حالة استقبال الاستفسارات.');
            }
        }

        async function openReception() {
            if (!ensureSupabaseConfigured()) return;
            try {
                await updateReceptionRemotely(true);
                isReceptionOpen = true;
                await addLogAction('إعادة فتح استقبال الاستفسارات على المنصة');
                renderAdminDashboardView();
            } catch (error) {
                console.error(error);
                alert('تعذر تحديث حالة استقبال الاستفسارات.');
            }
        }

        // Wipe Database Trigger
        async function confirmWipeAllData() {
            const firstConfirm = confirm('تنبيه شديد الخطورة!\nهل أنت متأكد من مسح جميع الأسئلة والإجابات والسجلات الإحصائية من المنصة؟');
            if (firstConfirm) {
                const secondConfirm = confirm('تأكيد نهائي: لن تتمكن من استعادة البيانات بعد المسح. هل تريد المتابعة؟');
                if (secondConfirm) {
                    if (!ensureSupabaseConfigured()) return;
                    try {
                        await wipeRemoteData();
                        questionsDatabase = [];
                        adminLogs = [];
                        await addLogAction('مسح شامل لجميع الأسئلة والإجابات والإحصائيات وتصفير البيانات');
                        alert('تم مسح جميع الأسئلة والإجابات وتصفير النظام بنجاح.');
                        renderAdminDashboardView();
                    } catch (error) {
                        console.error(error);
                        alert('تعذر تنفيذ المسح الشامل في قاعدة البيانات المركزية.');
                    }
                }
            }
        }

        // --- Export Functions ---

        function exportDirectorateExcel(targetName) {
            const data = questionsDatabase.filter(q => q.target === targetName);
            if (data.length === 0) {
                alert('لا توجد أسئلة مطروحة لهذه الدائرة لتصديرها.');
                return;
            }

            const excelRows = data.map((item, idx) => ({
                "م": idx + 1,
                "اسم المدرسة": item.schoolName,
                "رمز المدرسة": item.schoolCode,
                "السؤال المطروح": item.question,
                "الإجابة الرسمية": item.answer || "لم تتم الإجابة بعد",
                "تاريخ التقديم": item.timestamp
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الأسئلة");
            XLSX.writeFile(workbook, `أسئلة_${targetName.replace(/\s+/g, '_')}.xlsx`);
        }
